<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox RichText 생성기</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
    color: white;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #222;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

h2 {
    text-align: center;
}

input[type=text] {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: none;
    background: #333;
    color: white;
}

label {
    font-size: 14px;
    opacity: 0.8;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #ffb400;
    color: black;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

/* RGB 슬라이더 */
.slider-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

/* 슬라이더 공통 */
.slider {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    width: 100%;
    height: 8px;
    background: #555;
    border-radius: 5px;
    outline: none;
    cursor: pointer;
}

/* Webkit (Chrome, Safari) */
.slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: #ffb400;
    border: 2px solid #222;
    border-radius: 50%;
    margin-top: -5px; /* track 중앙 정렬 */
    cursor: pointer;
}

/* Firefox */
.slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: #ffb400;
    border: 2px solid #222;
    border-radius: 50%;
    cursor: pointer;
}

/* IE, Edge */
.slider::-ms-thumb {
    width: 18px;
    height: 18px;
    background: #ffb400;
    border: 2px solid #222;
    border-radius: 50%;
    cursor: pointer;
}

/* 트랙 높이 고정 */
.slider::-webkit-slider-runnable-track {
    height: 8px;
    border-radius: 5px;
    background: #555;
}
.slider::-moz-range-track {
    height: 8px;
    border-radius: 5px;
    background: #555;
}
.slider::-ms-track {
    height: 8px;
    border-radius: 5px;
    background: #555;
    border-color: transparent;
    color: transparent;
}

/* 색상 미리보기 박스 */
#colorPreview {
    width: 100%;
    height: 30px;
    border-radius: 8px;
    margin-top: 5px;
    border: 1px solid #555;
}

/* 결과 */
.result-box {
    background: #111;
    padding: 10px;
    border-radius: 10px;
    word-break: break-all;
    font-size: 13px;
}

/* Roblox 느낌 미리보기 */
.preview {
    background: #2b2b2b;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
}

.copy-btn {
    background: #4caf50;
}

@media(max-width: 550px){
    .container { padding: 10px; }
    .preview { font-size: 16px; }
}
</style>
</head>

<body>

<div class="container">

<h2>🎨 Roblox RichText 생성기</h2>

<!-- 텍스트 입력 카드 -->
<div class="card">
<label>전체 텍스트</label>
<input type="text" id="fullText" placeholder="예: 안녕하세요 반갑습니다">

<label>색 바꿀 단어</label>
<input type="text" id="targetText" placeholder="예: 반갑습니다">
</div>

<!-- 색상 조절 카드 -->
<div class="card">
<label>🎨 색상 조절 (RGB)</label>
<div class="slider-group">
R <input type="range" min="0" max="255" value="255" id="r" class="slider">
G <input type="range" min="0" max="255" value="180" id="g" class="slider">
B <input type="range" min="0" max="255" value="0" id="b" class="slider">
</div>
<div id="colorPreview"></div>
</div>

<!-- 결과 카드 -->
<div class="card">
<button onclick="generate()">✨ 생성하기</button>

<h4>📌 결과</h4>
<div id="result" class="result-box"></div>

<h4>👀 미리보기</h4>
<div id="preview" class="preview"></div>

<button class="copy-btn" onclick="copyText()">📋 복사</button>
</div>

</div>

<script>
// RGB 값 가져오기
function getRGB(){
    let r = document.getElementById("r").value;
    let g = document.getElementById("g").value;
    let b = document.getElementById("b").value;
    return `rgb(${r},${g},${b})`;
}

// RGB 미리보기 업데이트
function updatePreviewColor(){
    document.getElementById("colorPreview").style.backgroundColor = getRGB();
}

// 슬라이더 이벤트 연결
["r","g","b"].forEach(id => {
    document.getElementById(id).addEventListener("input", updatePreviewColor);
});

// 초기 색상 미리보기
updatePreviewColor();

// 생성 버튼
function generate(){
    let full = document.getElementById("fullText").value;
    let target = document.getElementById("targetText").value;

    if(!full || !target){
        alert("텍스트를 입력하세요!");
        return;
    }

    let rgb = getRGB();

    // Roblox용 RichText
    let result = full.replaceAll(target, `<font color="${rgb}">${target}</font>`);
    document.getElementById("result").innerText = result;

    // Roblox 느낌 미리보기
    let preview = full.replaceAll(target, `<span style="color:${rgb}">${target}</span>`);
    document.getElementById("preview").innerHTML = preview;
}

// 복사
function copyText(){
    let text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text);
    alert("복사 완료!");
}
</script>

</body>
</html>
